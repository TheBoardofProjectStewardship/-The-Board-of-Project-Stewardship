# GitHub Pages: Jekyll builds this repo. Internal files stay in git and are not published.
# Underscore directories are dropped unless listed in include. locations.html
# needs assets/images/places/_locations. Dot directories are dropped unless included.
# posts.json stays (it has no front matter and is not excluded). posts/*.md has
# front matter; exclude it so Jekyll does not render those files over posts/*.html.
theme: null
markdown: kramdown
exclude:
  - README.md
  - POSTING.md
  - edmonds-list-README.md
  - generate_site.py
  - docs
  - state
  - intake
  - places
  - tests
  - data
  - pages
  - assets/CDN-MAP.json
  - tools/board_intake.py
  - tools/check_seo_pack.py
  - tools/dup-scan.py
  - tools/image_md5_baseline.json
  - tools/write_40_posts.py
  - tools/__pycache__
  - __pycache__
  - posts/*.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - tools/make_perf_assets.py
  - assets/css/tw-input.css
  - assets/css/chrome.css
  - assets/css/fa-subset.css
  - assets/fonts/Inter-Regular.woff2
  - assets/fonts/Inter-Medium.woff2
  - assets/fonts/Inter-SemiBold.woff2
  - assets/fonts/Inter-Bold.woff2
# Jekyll matches include against the entry name it is filtering, so a nested
# underscore directory must be listed by its own name (`_locations`), not its
# full path. There is only one such directory.
# Jekyll 3.9 drops a file when its path starts with an exclude entry, not only
# when it is inside that directory. `exclude: pages` therefore also drops
# pages-build-stamp.txt. List the stamp here so /pages-build-stamp.txt is published.
include:
  - .well-known
  - _locations
  - pages-build-stamp.txt
defaults:
  - scope:
      path: posts
    values:
      published: false
