<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-D35MVNCWZN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-D35MVNCWZN');
</script>
<meta name="robots" content="noindex">
</head>
<body>
<!-- Host public/index.html at /tools/another-story/index.html.
     Paste this snippet into a trusted HTML block on the same website.
     The tool and this page must be same-origin; no API key belongs here. -->
<iframe
  id="another-story-sea"
  src="/tools/another-story/index.html"
  title="Another Story SEA — second-story design preview"
  loading="lazy"
  style="display:block;width:100%;height:1900px;border:0;border-radius:18px;"
></iframe>
<script>
(() => {
  const frame = document.getElementById('another-story-sea');
  const trustedOrigin = new URL(frame.src, window.location.href).origin;
  window.addEventListener('message', (event) => {
    if (event.origin !== trustedOrigin || event.source !== frame.contentWindow) return;
    if (event.data?.type !== 'another-story:resize') return;
    const height = Number(event.data.height);
    if (Number.isFinite(height) && height >= 300 && height <= 16000) {
      frame.style.height = `${Math.ceil(height) + 2}px`;
    }
  });
})();
</script>
</body>
</html>
