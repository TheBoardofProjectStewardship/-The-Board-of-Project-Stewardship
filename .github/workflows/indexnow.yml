name: IndexNow ping

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ping IndexNow for changed URLs
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: python3 generate_site.py --indexnow-only
