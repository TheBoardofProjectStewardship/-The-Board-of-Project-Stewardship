name: House size index

# Weekly rebuild of the static assessor house-size shards in assets/data/house-size/.
# That path is published by GitHub Pages. data/ is excluded in _config.yml.
# Separate from the morning blog intake. Does not publish intake submissions.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install builder dependency
        run: pip install openpyxl
      - name: Rebuild house-size index
        run: python3 scripts/build_index.py --out assets/data/house-size
      - name: Commit and push index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/house-size
          if git diff --staged --quiet; then
            echo "Index unchanged"
          else
            git commit -m "Refresh house-size index from county assessor records"
            git push
          fi
