name: Intake contract

# No schedule here. The only morning run is the existing 10:00 AM PT routine
# (BOPS daily blog post). Do not add a cron, and do not pass morning --apply.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run intake tests
        run: python3 -m unittest discover -s tests -v
