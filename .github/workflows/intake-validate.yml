name: Intake contract

# No schedule here. The only morning run is the existing 10:00 AM PT routine
# (BOPS daily blog post). Do not add a cron, and do not pass morning --apply.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: post dateModified follows the last commit that touched
      # the file. A depth-1 checkout makes every page look edited today.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run intake tests
        run: python3 -m unittest discover -s tests -v
      - name: Public page integrity
        run: python3 tools/check_seo_pack.py --ci
      - name: Image byte duplicates
        run: python3 tools/dup-scan.py
