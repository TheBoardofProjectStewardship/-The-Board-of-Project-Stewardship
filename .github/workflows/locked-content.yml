name: Locked content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash manifest for protected homepage copy
        run: python3 scripts/check_locked_content.py
      - name: Locked-content unit test
        run: python3 -m unittest tests.test_locked_content -v
